<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 연습</title>
</head>
<body>
    <script>
        // 1. 가장 간단한 함수
        function sayHi() {
            console.log('안녕하세요!');
        }

        sayHi();   // 함수 실행

        // 2. 괄호 안에 값 넣기
        function sayHello(name) {
            console.log(name + '님, 안녕하세요!');
        }

        sayHello('홍길동');
        sayHello('김철수');

        // 3. 결과를 돌려받기 (return)
        function add(a, b) {
            return a + b;
        }

        let result = add(3, 5);
        console.log(result);
    </script>
</body>
</html>
