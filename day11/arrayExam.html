<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .canvas{
            width: 600px;
            height: 500px;
            overflow: auto;
            border: 1px solid #000;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .box{
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            background-color: red;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="canvas" id="canvas"></div>
    <div>
        <button type="button" id="makeBtn">생성</button>
        <button type="button" id="delBtn">삭제</button>
    </div>
</body>
<script>
    const makeBtn = document.getElementById('makeBtn');
    const delBtn = document.getElementById('delBtn');

    makeBtn.addEventListener('click', makebox);
    delBtn.addEventListener('click', delbox);
    
    const boxes = [];

    function makebox(){
        const newbox = document.createElement('div');
        newbox.className = 'box';
        const canvas = document.getElementById('canvas');
        boxes.push(newbox);
        
        for(let i = 0; i < boxes.length; i++){
            canvas.appendChild(boxes[i]);
        }
    }

    function delbox(){
        if(boxes.length > 0){
            const lastBox = boxes.pop();   // 배열에서 마지막 박스를 꺼내서
            lastBox.remove();              // 화면에서 지움
        }
    }
    </script>
</html>
