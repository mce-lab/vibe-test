<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 200vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }
        .login-box {
            /*선그리기 : 두께 선모양 색상*/
            border: 1px solid black;
            width: 400px;
            height: 350px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align:center;
        }
        .title {
            text-align:center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 50px;
        }
        .input {
            width: 300px;
            height: 30px;
            margin-bottom: 10px;
            border: 5px solid black;
            border-radius: 5px;
            border-bottom: 5px solid black;
            outline: 0;
            margin-top: 20px;
        }
        .button {
            width: 300px;
            height: 30px;
            background-color: black;
            color: white;
            border-radius: 10px;
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="title">로그인</div>
            <div class="input">
                <input type="text" placeholder="ID"><br><br>
                <input type="password" placeholder="PW"><br><br>
                <button class="button">로그인</button>
            <input type="text" placeholder="ID"><br><br>
            <input type="password" placeholder="PW"><br><br>
            <button>로그인</button>
            <div class="btn>
                <button>회원가입</button>
            </div>

        </div>
    </div>
</body>
</html>
