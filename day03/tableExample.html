<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
         선택자 > css를 부여하는 대상
         div(태그명) : 페이지에서 해당 태그 전체에 적용
         # id : id가 적용된 tag 에 영향
            . class명 : 해당 클래스 명을 가진 태그에 적용
            */
    .blue{background-color: blue; color: white;}
    .pink{background-color: pink; color: white;}
    .ivory{background-color: ivory; color: black;}
    .linen{background-color: #fffff0; color: black;}
    </style>
</head>
<body>
    <div class="blue">1</div>
    <div class="pink">2</div>
    <div class="ivory">3</div>
    <div class="linen">4</div>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
</body>
</html>
